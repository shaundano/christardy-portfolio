{{ define "main" }}
  <div class="entry entry-with-image">
    {{ with .Params.image }}<img class="entry-image" src="{{ . | relURL }}" alt="{{ $.Title }}">{{ end }}
    <div class="entry-body">
      <h3>{{ .Title }}</h3>
      {{ .Content }}
      {{ with .Params.award }}<p>{{ . }}</p>{{ end }}
      {{ with .Params.repo }}<p><a href="{{ . }}" target="_blank" rel="noopener">Repository</a>.</p>{{ end }}
    </div>
  </div>
{{ end }}
