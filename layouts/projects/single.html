{{ define "main" }}
  {{ with .Params.image }}<img class="project-hero-image" src="{{ . | relURL }}" alt="{{ $.Title }}">{{ end }}
  <h1>{{ .Title }}</h1>
  {{ with .Params.dates }}<p class="project-dates">{{ . }}</p>{{ end }}
  {{ .Content }}
  {{ with .Params.award }}<p>{{ . }}</p>{{ end }}
  {{ with .Params.video }}<p><a href="{{ . }}" target="_blank" rel="noopener">Watch the demo</a>.</p>{{ end }}
  {{ with .Params.repo }}<p><a href="{{ . }}" target="_blank" rel="noopener">Repository</a>.</p>{{ end }}
{{ end }}
