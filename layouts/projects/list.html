{{ define "main" }}
  <h1>Projects</h1>
  {{ range .Pages.ByWeight }}
    <div class="entry entry-with-image">
      {{ with .Params.image }}<img class="entry-image" src="{{ . | relURL }}" alt="{{ $.Title }}">{{ end }}
      <div class="entry-body">
        {{ .Content }}
      </div>
    </div>
  {{ end }}
{{ end }}
