<a class="project-card" href="{{ .RelPermalink }}">
  {{ with .Params.image }}<img class="entry-image" src="{{ . | relURL }}" alt="{{ $.Title }}">{{ end }}
  <div class="entry-body">
    <h3>{{ .Title }}</h3>
    {{ .Content }}
    {{ with .Params.award }}<p class="award">{{ . }}</p>{{ end }}
  </div>
</a>
